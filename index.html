<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時協作文字雲 - 共享與管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=ZCOOL_KuaiLe&family=Ma_Shan_Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        kuaile: ['ZCOOL KuaiLe', 'sans-serif'],
                        shanzheng: ['Ma Shan Zheng', 'cursive'],
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(6, 182, 212, 0.4)',
                        'neon-pink': '0 0 15px rgba(236, 72, 153, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen">

    <main class="flex-grow flex flex-col justify-center">
        <div id="view-input" class="view-section flex-grow flex flex-col items-center justify-center p-4">
            <div class="max-w-lg w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-md shadow-2xl transition duration-300 hover:border-slate-700/80">
                <div class="text-center mb-6">
                    <div class="inline-flex bg-gradient-to-tr from-cyan-500 to-fuchsia-600 p-3.5 rounded-2xl shadow-neon-cyan mb-4">
                        <i class="fa-solid fa-cloud-word text-white text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-fuchsia-500 tracking-wider">即時協作。填寫關鍵字</h1>
                    <p class="text-xs text-slate-400 mt-1">您的輸入將會即時加入大螢幕文字雲中！</p>
                </div>

                <div class="space-y-4">
                    <textarea id="word-input" rows="4" placeholder="請輸入您想加入的字詞...&#10;可以使用「空白」或「逗號」一次輸入多個！&#10;例如：創意 科技, 智慧，未來" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition duration-200 text-sm resize-none"></textarea>
                    
                    <button id="btn-submit" onclick="submitWords()" class="w-full bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-md hover:shadow-neon-cyan flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>送出關鍵字</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-cloud" class="view-section flex-grow hidden flex-col p-4 relative h-screen">
            <div class="flex-grow w-full flex flex-col items-center justify-center relative overflow-hidden bg-slate-950/40 rounded-2xl border border-slate-900">
                <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/20 backdrop-blur-xs z-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400"></div>
                    <p class="text-xs text-slate-400 mt-3 font-mono tracking-widest">文字雲同步中...</p>
                </div>
                <div id="empty-state" class="hidden text-center max-w-sm px-6">
                    <div class="w-16 h-16 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-700">
                        <i class="fa-solid fa-cloud text-slate-400 text-2xl animate-pulse"></i>
                    </div>
                    <h3 class="text-md font-bold text-slate-300 mb-1">文字雲目前空空如也</h3>
                    <p class="text-xs text-slate-500 leading-relaxed mb-4">請大家掃描或開啟填寫連結，在對話框內輸入任何想法！</p>
                </div>
                <canvas id="cloud-canvas" class="w-full h-full block rounded-xl hidden cursor-pointer"></canvas>
            </div>
        </div>

        <div id="view-admin" class="view-section flex-grow hidden p-4 sm:p-6 max-w-7xl w-full mx-auto">
            <div id="admin-gate" class="max-w-md mx-auto mt-12 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl text-center">
                <div class="w-12 h-12 bg-fuchsia-950/60 text-fuchsia-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-fuchsia-800/40">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-200 mb-2">管理者密碼驗證</h2>
                <p class="text-xs text-slate-400 mb-6">請輸入管理者密碼以解鎖清除與設定功能</p>
                <div class="space-y-4">
                    <input type="password" id="admin-pwd-input" placeholder="請輸入密碼..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 transition">
                    <button onclick="verifyAdminPassword()" class="w-full bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white font-bold py-3 rounded-xl transition shadow-md">驗證登入</button>
                </div>
            </div>
            <div id="admin-panel" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md">
                        <h2 class="text-md font-bold text-slate-200 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-sliders text-cyan-400"></i> 管理者視覺設置
                        </h2>
                        <div class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">文字雲顏色主題</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="changePalette('ocean')" id="palette-ocean" class="palette-btn border-2 border-cyan-500 bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between"><span class="text-xs">霓虹海洋</span></button>
                                    <button onclick="changePalette('sunset')" id="palette-sunset" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between"><span class="text-xs">日落晚霞</span></button>
                                    <button onclick="changePalette('forest')" id="palette-forest" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between"><span class="text-xs">森林微風</span></button>
                                    <button onclick="changePalette('cyberpunk')" id="palette-cyberpunk" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between"><span class="text-xs">賽博朋克</span></button>
                                </div>
                            </div>
                            <div>
                                <label for="font-select" class="block text-xs text-slate-400 mb-1.5">字體風格</label>
                                <select id="font-select" onchange="changeFont()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-300 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                                    <option value="system-ui, -apple-system, sans-serif">預設黑體 (Noto Sans)</option>
                                    <option value="ZCOOL KuaiLe">歡樂體 (圓潤)</option>
                                    <option value="Ma Shan Zheng">書法體 (草書)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md">
                        <h2 class="text-md font-bold text-slate-200 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-bolt text-rose-400"></i> 快速維護管理
                        </h2>
                        <div class="space-y-3">
                            <button onclick="openClearModal()" class="w-full flex items-center justify-center gap-2 bg-rose-950/50 hover:bg-rose-900/70 text-rose-200 border border-rose-800/60 py-3 rounded-xl transition">
                                <i class="fa-solid fa-trash-can"></i> <span>清空所有字詞數據</span>
                            </button>
                            <button onclick="downloadCloudImage()" class="w-full flex items-center justify-center gap-2 bg-cyan-950/50 hover:bg-cyan-900/70 text-cyan-200 border border-cyan-800/60 py-3 rounded-xl transition">
                                <i class="fa-solid fa-download"></i> <span>下載文字雲圖片 (PNG)</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md flex flex-col h-[550px]">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h2 class="text-md font-bold text-slate-200 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-indigo-400"></i> 關鍵字管理與刪除列表
                            </h2>
                            <p class="text-xs text-slate-500 mt-0.5" id="word-count-badge">共 0 個字詞</p>
                        </div>
                    </div>
                    <div class="relative mb-3">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                        <input type="text" id="stat-search" oninput="filterStats()" placeholder="搜尋字詞或進行篩選..." class="w-full bg-slate-950/80 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                    </div>
                    <div id="stats-list-container" class="flex-grow overflow-y-auto pr-1 space-y-2">
                        <div class="text-center py-12 text-slate-500 text-xs">暫無任何協作字詞</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="hidden md:block bg-slate-950/80 border-t border-slate-800/80 px-4 py-3 sticky bottom-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="current-mode-indicator" class="font-semibold text-slate-300">目前模式：✍️ 填寫字詞</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="copyShareLink()" class="hover:text-cyan-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-share-nodes text-cyan-500"></i><span>複製填寫連結</span>
                </button>
                <span class="text-slate-700">|</span>
                <div class="flex gap-2">
                    <button id="btn-goto-input" onclick="switchView('input')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">✍️ 填寫字詞</button>
                    <button id="btn-goto-cloud" onclick="switchView('cloud')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">☁️ 文字雲投影</button>
                    <button id="btn-goto-admin" onclick="switchView('admin')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">🔑 管理後台</button>
                </div>
            </div>
        </div>
    </footer>

    <div id="clear-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl transform scale-95 transition-transform duration-200">
            <div class="flex items-center gap-3 text-rose-500 mb-3">
                <div class="bg-rose-950/80 p-2.5 rounded-lg border border-rose-800/40"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                <h3 class="text-lg font-bold">確認清除所有協作字詞？</h3>
            </div>
            <p class="text-sm text-slate-400 mb-6 leading-relaxed">這個動作會將目前「即時協作文字雲」上的所有單字全數刪除，且所有人畫面都將同步清空。此操作無法復原，請確認您要繼續執行嗎？</p>
            <div class="flex gap-3 justify-end">
                <button onclick="closeClearModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-4 py-2 rounded-lg transition">取消</button>
                <button id="btn-confirm-clear" onclick="clearAllWords()" class="bg-rose-600 hover:bg-rose-500 text-white text-sm px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2">
                    <span id="clear-loading-icon" class="hidden"><i class="fa-solid fa-spinner animate-spin"></i></span>
                    <span>確定，全部清空</span>
                </button>
            </div>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-16 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config (請務必替換您的參數)
        const firebaseConfig = {
          apiKey: "AIzaSyAxeQj7sPAf2r2oVdXQZ-voanKrKYzxyr8",
          authDomain: "wordcloud-4f96a.firebaseapp.com",
          projectId: "wordcloud-4f96a",
          storageBucket: "wordcloud-4f96a.firebasestorage.app",
          messagingSenderId: "347442599188",
          appId: "1:347442599188:web:6160c443ffda1d20875e01"
        };

        const appId = 'my-wordcloud-app';
        let db, isFirebaseActive = false;
        let wordDataList = [];

        window.currentPalette = 'ocean';
        window.currentFont = 'system-ui, -apple-system, sans-serif';
        window.palettes = {
            ocean: ['#22d3ee', '#06b6d4', '#0891b2', '#3b82f6', '#6366f1', '#a5b4fc', '#818cf8'],
            sunset: ['#f59e0b', '#fbbf24', '#f97316', '#ef4444', '#f43f5e', '#ec4899', '#d946ef'],
            forest: ['#10b981', '#34d399', '#059669', '#14b8a6', '#2dd4bf', '#84cc16', '#a3e635'],
            cyberpunk: ['#d946ef', '#f43f5e', '#22d3ee', '#fbbf24', '#a855f7', '#ec4899', '#22c55e']
        };

        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
                isFirebaseActive = true;
                startSync();
            } catch (e) {
                console.error(e);
                isFirebaseActive = false;
            }
        }

        function startSync() {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'words');
            onSnapshot(col, (snap) => {
                wordDataList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                processAndUpdateUI();
            });
        }

        window.submitWords = async function() {
            const input = document.getElementById('word-input');
            const val = input.value.trim();
            if (!val) return;
            const words = val.split(/[\s,，、\n]+/).filter(w => w);
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'words');
            for(let text of words) await addDoc(col, { text, timestamp: Date.now() });
            input.value = '';
            showToast("成功送出！");
        };

        window.clearAllWords = async function() {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'words'));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            closeClearModal();
            showToast("已清空");
        };

        // UI 渲染與其他輔助函數 (為精簡篇幅，關鍵邏輯已在此處)
        function processAndUpdateUI() {
            const canvas = document.getElementById('cloud-canvas');
            if (wordDataList.length === 0) return canvas.classList.add('hidden');
            canvas.classList.remove('hidden');
            const freq = {};
            wordDataList.forEach(w => freq[w.text] = (freq[w.text] || 0) + 1);
            const list = Object.entries(freq);
            WordCloud(canvas, { list, fontFamily: window.currentFont, weightFactor: 20 });
        }

        window.onload = initApp;
    </script>
</body>
</html>
