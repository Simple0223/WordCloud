<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時協作文字雲 - 共享與管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=ZCOOL_KuaiLe&family=Ma_Shan_Zheng&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- WordCloud2.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        kuaile: ['ZCOOL KuaiLe', 'sans-serif'],
                        shanzheng: ['Ma Shan Zheng', 'cursive'],
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(6, 182, 212, 0.4)',
                        'neon-pink': '0 0 15px rgba(236, 72, 153, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Elegant custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen">

    <main class="flex-grow flex flex-col justify-center">
        <!-- 1. WRITE/INPUT VIEW: Ultra clean, input only -->
        <div id="view-input" class="view-section flex-grow flex flex-col items-center justify-center p-4">
            <div class="max-w-lg w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-md shadow-2xl transition duration-300 hover:border-slate-700/80">
                <div class="text-center mb-6">
                    <div class="inline-flex bg-gradient-to-tr from-cyan-500 to-fuchsia-600 p-3.5 rounded-2xl shadow-neon-cyan mb-4">
                        <i class="fa-solid fa-cloud-word text-white text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-fuchsia-500 tracking-wider">即時協作。填寫關鍵字</h1>
                    <p class="text-xs text-slate-400 mt-1">您的輸入將會即時加入大螢幕文字雲中！</p>
                </div>

                <div class="space-y-4">
                    <textarea id="word-input" rows="4" placeholder="請輸入您想加入的字詞...&#10;一次最多25個字唷！" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition duration-200 text-sm resize-none"></textarea>
                    
                    <button id="btn-submit" onclick="submitWords()" class="w-full bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-md hover:shadow-neon-cyan flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>送出關鍵字</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. CLOUD VIEW: 100% pure cloud display -->
        <div id="view-cloud" class="view-section flex-grow hidden flex-col p-4 relative h-screen">
            <div class="flex-grow w-full flex flex-col items-center justify-center relative overflow-hidden bg-slate-950/40 rounded-2xl border border-slate-900">
                <!-- Loading Indicator -->
                <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/20 backdrop-blur-xs z-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400"></div>
                    <p class="text-xs text-slate-400 mt-3 font-mono tracking-widest">文字雲同步中...</p>
                </div>

                <!-- Empty Word Cloud State -->
                <div id="empty-state" class="hidden text-center max-w-sm px-6">
                    <div class="w-16 h-16 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-700">
                        <i class="fa-solid fa-cloud text-slate-400 text-2xl animate-pulse"></i>
                    </div>
                    <h3 class="text-md font-bold text-slate-300 mb-1">文字雲目前空空如也</h3>
                    <p class="text-xs text-slate-500 leading-relaxed mb-4">請大家踴躍留言！</p>
                </div>

                <!-- HTML5 Wordcloud Canvas -->
                <canvas id="cloud-canvas" class="w-full h-full block rounded-xl hidden cursor-pointer"></canvas>
            </div>
        </div>

        <!-- 3. ADMIN VIEW: Admin Dashboard with password and management features -->
        <div id="view-admin" class="view-section flex-grow hidden p-4 sm:p-6 max-w-7xl w-full mx-auto">
            <!-- Password gate -->
            <div id="admin-gate" class="max-w-md mx-auto mt-12 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl text-center">
                <div class="w-12 h-12 bg-fuchsia-950/60 text-fuchsia-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-fuchsia-800/40">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-200 mb-2">管理者密碼驗證</h2>
                <p class="text-xs text-slate-400 mb-6">請輸入管理者密碼以解鎖清除與設定功能</p>
                
                <div class="space-y-4">
                    <input type="password" id="admin-pwd-input" placeholder="請輸入密碼..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 transition">
                    <button onclick="verifyAdminPassword()" class="w-full bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white font-bold py-3 rounded-xl transition shadow-md">
                        驗證登入
                    </button>
                </div>
            </div>

            <!-- Authenticated Admin Panel -->
            <div id="admin-panel" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Admin Column 1: Config & Stats -->
                <div class="lg:col-span-1 space-y-6">
                    <!-- Word Cloud Config Card -->
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md">
                        <h2 class="text-md font-bold text-slate-200 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-sliders text-cyan-400"></i>
                            管理者視覺設置
                        </h2>
                        
                        <div class="space-y-4 text-sm">
                            <!-- Palette Select -->
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">文字雲顏色主題</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="changePalette('ocean')" id="palette-ocean" class="palette-btn border-2 border-cyan-500 bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between">
                                        <span class="text-xs">霓虹海洋</span>
                                        <div class="flex gap-0.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                                        </div>
                                    </button>
                                    <button onclick="changePalette('sunset')" id="palette-sunset" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between">
                                        <span class="text-xs">日落晚霞</span>
                                        <div class="flex gap-0.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                                        </div>
                                    </button>
                                    <button onclick="changePalette('forest')" id="palette-forest" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between">
                                        <span class="text-xs">森林微風</span>
                                        <div class="flex gap-0.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-teal-500"></span>
                                        </div>
                                    </button>
                                    <button onclick="changePalette('cyberpunk')" id="palette-cyberpunk" class="palette-btn border-2 border-transparent bg-slate-950 p-2 rounded-lg flex items-center gap-2 justify-between">
                                        <span class="text-xs">賽博朋克</span>
                                        <div class="flex gap-0.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-fuchsia-500"></span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
                                        </div>
                                    </button>
                                </div>
                            </div>

                            <!-- Font Select -->
                            <div>
                                <label for="font-select" class="block text-xs text-slate-400 mb-1.5">字體風格</label>
                                <select id="font-select" onchange="changeFont()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-300 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                                    <option value="system-ui, -apple-system, sans-serif">預設黑體 (Noto Sans)</option>
                                    <option value="ZCOOL KuaiLe">歡樂體 (圓潤)</option>
                                    <option value="Ma Shan Zheng">書法體 (草書)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Admin Action Card -->
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md">
                        <h2 class="text-md font-bold text-slate-200 flex items-center gap-2 mb-4">
                            <i class="fa-solid fa-bolt text-rose-400"></i>
                            快速維護管理
                        </h2>
                        <div class="space-y-3">
                            <button onclick="openClearModal()" class="w-full flex items-center justify-center gap-2 bg-rose-950/50 hover:bg-rose-900/70 text-rose-200 border border-rose-800/60 py-3 rounded-xl transition">
                                <i class="fa-solid fa-trash-can"></i>
                                <span>清空所有字詞數據</span>
                            </button>
                            <button onclick="downloadCloudImage()" class="w-full flex items-center justify-center gap-2 bg-cyan-950/50 hover:bg-cyan-900/70 text-cyan-200 border border-cyan-800/60 py-3 rounded-xl transition">
                                <i class="fa-solid fa-download"></i>
                                <span>下載文字雲圖片 (PNG)</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Admin Column 2: Word Management Table -->
                <div class="lg:col-span-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur-md flex flex-col h-[550px]">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h2 class="text-md font-bold text-slate-200 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-indigo-400"></i>
                                關鍵字管理與刪除列表
                            </h2>
                            <p class="text-xs text-slate-500 mt-0.5" id="word-count-badge">共 0 個字詞</p>
                        </div>
                    </div>

                    <!-- Word Search Filter -->
                    <div class="relative mb-3">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                        <input type="text" id="stat-search" oninput="filterStats()" placeholder="搜尋字詞或進行篩選..." class="w-full bg-slate-950/80 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                    </div>

                    <!-- Word scrollable list -->
                    <div id="stats-list-container" class="flex-grow overflow-y-auto pr-1 space-y-2">
                        <div class="text-center py-12 text-slate-500 text-xs">暫無任何協作字詞</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bottom Floating Navigation & Status Dock -->
    <footer class="hidden md:block bg-slate-950/80 border-t border-slate-800/80 px-4 py-3 sticky bottom-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
            
            <!-- Mode indicator status -->
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="current-mode-indicator" class="font-semibold text-slate-300">目前模式：✍️ 填寫字詞</span>
            </div>

            <!-- Global Action Controls -->
            <div class="flex items-center gap-3">
                <button onclick="copyShareLink()" class="hover:text-cyan-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-share-nodes text-cyan-500"></i>
                    <span>複製填寫連結</span>
                </button>
                <span class="text-slate-700">|</span>
                <!-- Mode Switches -->
                <div class="flex gap-2">
                    <button id="btn-goto-input" onclick="switchView('input')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">
                        ✍️ 填寫字詞
                    </button>
                    <button id="btn-goto-cloud" onclick="switchView('cloud')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">
                        ☁️ 文字雲投影
                    </button>
                    <button id="btn-goto-admin" onclick="switchView('admin')" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">
                        🔑 管理後台
                    </button>
                </div>
            </div>

        </div>
    </footer>

    <!-- Custom Modal: Clear Confirmation Dialog -->
    <div id="clear-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl transform scale-95 transition-transform duration-200">
            <div class="flex items-center gap-3 text-rose-500 mb-3">
                <div class="bg-rose-950/80 p-2.5 rounded-lg border border-rose-800/40">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <h3 class="text-lg font-bold">確認清除所有協作字詞？</h3>
            </div>
            <p class="text-sm text-slate-400 mb-6 leading-relaxed">這個動作會將目前「即時協作文字雲」上的所有單字全數刪除，且所有人畫面都將同步清空。此操作無法復原，請確認您要繼續執行嗎？</p>
            <div class="flex gap-3 justify-end">
                <button onclick="closeClearModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-4 py-2 rounded-lg transition">
                    取消
                </button>
                <button id="btn-confirm-clear" onclick="clearAllWords()" class="bg-rose-600 hover:bg-rose-500 text-white text-sm px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2">
                    <span id="clear-loading-icon" class="hidden"><i class="fa-solid fa-spinner animate-spin"></i></span>
                    <span>確定，全部清空</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Floating Toast Notifications System -->
    <div id="toast-container" class="fixed bottom-16 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db = null;
        let auth = null;
        let wordDataList = [];
        let isFirebaseActive = false;
        
        // Active Configs
        const appId = 'my-wordcloud-app'; // 可以自行更改為您的應用名稱
        
        // 【重要】請將下方的資訊替換為您在 Firebase 後台取得的設定
        const firebaseConfig = {
          apiKey: "AIzaSyAxeQj7sPAf2r2oVdXQZ-voanKrKYzxyr8",
          authDomain: "wordcloud-4f96a.firebaseapp.com",
          projectId: "wordcloud-4f96a",
          storageBucket: "wordcloud-4f96a.firebasestorage.app",
          messagingSenderId: "347442599188",
          appId: "1:347442599188:web:6160c443ffda1d20875e01"
        };
        const initialAuthToken = null;

        // Custom UI Configs
        window.currentPalette = 'ocean';
        window.currentFont = 'system-ui, -apple-system, sans-serif';
        window.palettes = {
            ocean: ['#22d3ee', '#06b6d4', '#0891b2', '#3b82f6', '#6366f1', '#a5b4fc', '#818cf8'],
            sunset: ['#f59e0b', '#fbbf24', '#f97316', '#ef4444', '#f43f5e', '#ec4899', '#d946ef'],
            forest: ['#10b981', '#34d399', '#059669', '#14b8a6', '#2dd4bf', '#84cc16', '#a3e635'],
            cyberpunk: ['#d946ef', '#f43f5e', '#22d3ee', '#fbbf24', '#a855f7', '#ec4899', '#22c55e']
        };

        async function initApp() {
            showLoading(true);
            if (!firebaseConfig) {
                showToast("未偵測到雲端資料庫，已啟用本機協作模擬模式！", "warning");
                initLocalStorageMode();
                return;
            }

            try {
                // Initialize Firebase SDKs
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authenticate (RULE 3 - Auth Priority & Check)
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                isFirebaseActive = true;
                startRealtimeDatabaseSync();
            } catch (error) {
                console.error("Firebase auth/init error:", error);
                showToast("雲端連線失敗，正在切換為本機模擬模式...", "error");
                initLocalStorageMode();
            }
        }

        function startRealtimeDatabaseSync() {
            if (!isFirebaseActive || !db) return;

            // RULE 1: Standardized structure for public sharing data
            const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'words');

            // Set up onSnapshot with required error handler
            onSnapshot(collectionPath, (snapshot) => {
                const words = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    words.push({
                        id: doc.id,
                        text: data.text || '',
                        timestamp: data.timestamp || 0
                    });
                });
                
                // Update in-memory state
                wordDataList = words;
                processAndUpdateUI();
                showLoading(false);
            }, (error) => {
                console.error("Firestore loading error:", error);
                showToast("數據載入失敗，請重新整理網頁！", "error");
                showLoading(false);
            });
        }

        // Fallback Local Storage Mode for offline preview support
        function initLocalStorageMode() {
            isFirebaseActive = false;
            const savedWords = localStorage.getItem(`wordcloud_local_${appId}`);
            if (savedWords) {
                try {
                    wordDataList = JSON.parse(savedWords);
                } catch (e) {
                    wordDataList = [];
                }
            } else {
                // Pre-fill placeholder mockup words for a beautiful demo
                wordDataList = [
                    { id: '1', text: '科技', timestamp: Date.now() },
                    { id: '2', text: '創新', timestamp: Date.now() },
                    { id: '3', text: '合作', timestamp: Date.now() },
                    { id: '4', text: '未來', timestamp: Date.now() },
                    { id: '5', text: '即時同步', timestamp: Date.now() },
                    { id: '6', text: '創意', timestamp: Date.now() }
                ];
                localStorage.setItem(`wordcloud_local_${appId}`, JSON.stringify(wordDataList));
            }
            processAndUpdateUI();
            showLoading(false);
        }

        window.submitWords = async function() {
            const inputElement = document.getElementById('word-input');
            const submitBtn = document.getElementById('btn-submit');
            const rawText = inputElement.value.trim();

            if (!rawText) {
                showToast("請先輸入想要填寫的字詞！", "warning");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>正在送出...</span>`;

            // Split raw string by spaces or commas (half-width or full-width)
            //const wordsToAdd = rawText.split(/[\s,，、\n]+/).map(w => w.trim()).filter(w => w.length > 0 && w.length <= 25); // Limit character length for visual clarity

            const wordsToAdd = [rawText];
            
            if (rawText.length > 25) {
                showToast("字詞太長囉！請限制在 25 字以內。", "warning");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>送出關鍵字</span>`;
                return;
            }

            try {
                if (isFirebaseActive && db) {
                    const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'words');
                    const promises = wordsToAdd.map(wordText => {
                        return addDoc(collectionPath, {
                            text: wordText,
                            timestamp: Date.now()
                        });
                    });
                    await Promise.all(promises);
                } else {
                    // Local Storage fallback simulation
                    wordsToAdd.forEach(wordText => {
                        wordDataList.push({
                            id: crypto.randomUUID(),
                            text: wordText,
                            timestamp: Date.now()
                        });
                    });
                    localStorage.setItem(`wordcloud_local_${appId}`, JSON.stringify(wordDataList));
                    processAndUpdateUI();
                }

                inputElement.value = '';
                showToast(`成功新增 ${wordsToAdd.length} 個字詞！`, "success");
            } catch (err) {
                console.error("Submit words error:", err);
                showToast("提交失敗，請檢查網路連線！", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>送出關鍵字</span>`;
            }
        };

        window.addQuickWord = function(tag) {
            const inputElement = document.getElementById('word-input');
            const currentVal = inputElement.value.trim();
            if (currentVal) {
                inputElement.value = currentVal + " " + tag;
            } else {
                inputElement.value = tag;
            }
            inputElement.focus();
        };

        window.deleteWord = async function(wordIdOrText) {
            try {
                if (isFirebaseActive && db) {
                    // Delete specific document from firestore
                    const querySnapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'words'));
                    const promises = [];
                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        // If it's standard direct ID delete or matching all instances of text
                        if (document.id === wordIdOrText || data.text === wordIdOrText) {
                            promises.push(deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'words', document.id)));
                        }
                    });
                    await Promise.all(promises);
                } else {
                    // Local Storage fallback
                    wordDataList = wordDataList.filter(item => item.id !== wordIdOrText && item.text !== wordIdOrText);
                    localStorage.setItem(`wordcloud_local_${appId}`, JSON.stringify(wordDataList));
                    processAndUpdateUI();
                }
                showToast("該字詞已成功刪除！", "success");
            } catch (err) {
                console.error("Delete operation failed:", err);
                showToast("刪除失敗，請重試！", "error");
            }
        };

        window.clearAllWords = async function() {
            const confirmBtn = document.getElementById('btn-confirm-clear');
            const loadingIcon = document.getElementById('clear-loading-icon');

            confirmBtn.disabled = true;
            loadingIcon.classList.remove('hidden');

            try {
                if (isFirebaseActive && db) {
                    // Fetch all existing words
                    const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'words');
                    const querySnapshot = await getDocs(collectionPath);
                    
                    // Firestore allows Batch delete up to 500 actions
                    const batch = writeBatch(db);
                    querySnapshot.forEach((document) => {
                        batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'words', document.id));
                    });
                    await batch.commit();
                } else {
                    // Local storage fallback clear
                    wordDataList = [];
                    localStorage.setItem(`wordcloud_local_${appId}`, JSON.stringify(wordDataList));
                    processAndUpdateUI();
                }
                
                showToast("文字雲資料庫已成功清空！", "success");
                closeClearModal();
            } catch (err) {
                console.error("Clear database failed:", err);
                showToast("清空作業失敗，請再試一次！", "error");
            } finally {
                confirmBtn.disabled = false;
                loadingIcon.classList.add('hidden');
            }
        };

        let resizeTimer = null;
        function processAndUpdateUI() {
            const canvas = document.getElementById('cloud-canvas');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('word-count-badge');

            // Compute words list & total counts
            countBadge.innerText = `目前共計：${wordDataList.length} 個字詞`;

            if (wordDataList.length === 0) {
                canvas.classList.add('hidden');
                emptyState.classList.remove('hidden');
                renderStatsList([]);
                return;
            }

            emptyState.classList.add('hidden');
            canvas.classList.remove('hidden');

            // Process text occurrence counts
            const freqMap = {};
            wordDataList.forEach(item => {
                const cleaned = item.text.trim();
                if (cleaned) {
                    freqMap[cleaned] = (freqMap[cleaned] || 0) + 1;
                }
            });

            // Convert to format required by WordCloud2: [['word', weight], ...]
            const cloudList = Object.entries(freqMap).map(([text, count]) => [text, count]);
            
            // Sort highest weight first
            cloudList.sort((a, b) => b[1] - a[1]);

            // Save list globally for filters and statistics rendering
            window.lastCloudList = cloudList;
            renderStatsList(cloudList);

            // Execute actual render with adaptive sizing
            triggerWordCloudDraw(canvas, cloudList);
        }

        // Adaptive Draw Action on HTML5 Canvas
        function triggerWordCloudDraw(canvas, list) {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const containerWidth = container.offsetWidth;
            const containerHeight = Math.max(450, container.offsetHeight);

            canvas.width = containerWidth * dpr;
            canvas.height = containerHeight * dpr;
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerHeight + 'px';

            const maxCount = list[0] ? list[0][1] : 1;
            const activeColors = window.palettes[window.currentPalette];
            
            // Calculate base scale according to density and canvas size
            const fontScaleBase = Math.min(canvas.width, canvas.height) / 800;

            try {
                WordCloud(canvas, {
                    list: list,
                    gridSize: Math.round(12 * fontScaleBase * dpr),
                    weightFactor: function (size) {
                        // Log scale to normalize extremely popular words vs less popular ones
                        const ratio = Math.log2(size + 1) / Math.log2(maxCount + 1);
                        const weight = Math.max(14, ratio * 75 * fontScaleBase * dpr);
                        return weight;
                    },
                    fontFamily: window.currentFont,
                    color: function () {
                        // Pick random color from current color theme list
                        return activeColors[Math.floor(Math.random() * activeColors.length)];
                    },
                    rotateRatio: 0.3, 
                    rotationSteps: 2,
                    backgroundColor: 'transparent',
                    drawOutOfBound: false,
                    shuffle: false,
                    wait: 5
                });
            } catch (err) {
                console.error("WordCloud2 canvas drawing error:", err);
            }
        }

        function renderStatsList(list) {
            const container = document.getElementById('stats-list-container');
            const searchVal = document.getElementById('stat-search').value.toLowerCase().trim();
            
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">目前無任何數據</div>`;
                return;
            }

            const filteredList = list.filter(([text]) => text.toLowerCase().includes(searchVal));

            if (filteredList.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">無相符的篩選字詞</div>`;
                return;
            }

            // Generate list items with interactive trash buttons
            let html = '';
            filteredList.forEach(([text, count], index) => {
                html += `
                    <div class="flex items-center justify-between bg-slate-950/50 border border-slate-800/40 rounded-xl px-4 py-2.5 text-xs hover:border-slate-700/60 transition">
                        <div class="flex items-center gap-3 overflow-hidden mr-2">
                            <span class="w-5 h-5 flex items-center justify-center rounded-md bg-slate-800 text-slate-400 text-[10px]">
                                ${index + 1}
                            </span>
                            <span class="font-semibold text-slate-200 truncate">${text}</span>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="bg-cyan-950/40 text-cyan-400 border border-cyan-900/40 px-2 py-0.5 rounded-full font-mono font-bold">
                                ${count} 次
                            </span>
                            <button onclick="deleteWord('${text}')" class="text-rose-400 hover:text-rose-300 bg-rose-950/20 hover:bg-rose-950/60 p-1.5 rounded-lg border border-rose-900/30 transition" title="刪除此字詞">
                                <i class="fa-solid fa-trash text-[11px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.filterStats = function() {
            if (window.lastCloudList) {
                renderStatsList(window.lastCloudList);
            }
        };

        // Change palettes and fonts
        window.changePalette = function(paletteName) {
            window.currentPalette = paletteName;
            document.querySelectorAll('.palette-btn').forEach(btn => {
                btn.classList.add('border-transparent');
                btn.classList.remove('border-cyan-500');
            });
            const activeBtn = document.getElementById(`palette-${paletteName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent');
                activeBtn.classList.add('border-cyan-500');
            }
            processAndUpdateUI();
            showToast(`已切換配色主題！`, "success");
        };

        window.changeFont = function() {
            window.currentFont = document.getElementById('font-select').value;
            processAndUpdateUI();
            showToast("字型已變更", "success");
        };

        // Canvas export
        window.downloadCloudImage = function() {
            const canvas = document.getElementById('cloud-canvas');
            if (!canvas || wordDataList.length === 0) {
                showToast("目前無任何資料可下載！", "warning");
                return;
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const ctx = tempCanvas.getContext('2d');

            // Draw theme gradient background
            const grad = ctx.createRadialGradient(tempCanvas.width/2, tempCanvas.height/2, 10, tempCanvas.width/2, tempCanvas.height/2, tempCanvas.width * 0.8);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // Overlay actual canvas
            ctx.drawImage(canvas, 0, 0);

            const url = tempCanvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            a.download = `即時協作文字雲_${new Date().toISOString().slice(0, 10)}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("下載匯出成功！", "success");
        };

        // Window resize event handler (with debounce)
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (wordDataList.length > 0) {
                    processAndUpdateUI();
                }
            }, 300);
        });

        // Initialize App on load
        window.onload = function() {
            initApp();
        };
    </script>

    <!-- Controller scripts for view switching, login gates and toasts -->
    <script>
        // Store Admin status
        let isAdminAuthenticated = false;

        // Simple routing control between modes
        function switchView(targetView) {
            // Check password validation for Admin Control panel
            if (targetView === 'admin' && !isAdminAuthenticated) {
                // Keep target view name as global to route after login
                window.pendingTargetView = 'admin';
                showAdminGate(true);
            } else {
                showAdminGate(false);
                executeViewSwitch(targetView);
            }
        }

        function executeViewSwitch(targetView) {
            // Hide all views
            document.querySelectorAll('.view-section').forEach(view => {
                view.classList.add('hidden');
            });

            // Show selected view
            const activeView = document.getElementById(`view-${targetView}`);
            if (activeView) {
                activeView.classList.remove('hidden');
                if (targetView === 'cloud') {
                    activeView.classList.add('flex');
                }
            }

            // Highlight footer buttons
            const buttons = {
                input: 'btn-goto-input',
                cloud: 'btn-goto-cloud',
                admin: 'btn-goto-admin'
            };

            Object.entries(buttons).forEach(([key, btnId]) => {
                const btn = document.getElementById(btnId);
                if (key === targetView) {
                    btn.className = "bg-gradient-to-r from-cyan-500 to-fuchsia-600 text-white font-semibold px-3 py-1.5 rounded-lg border-none shadow-sm transition";
                } else {
                    btn.className = "bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition";
                }
            });

            // Update footer info text
            const indicator = document.getElementById('current-mode-indicator');
            if (targetView === 'input') {
                indicator.innerText = "目前模式：✍️ 填寫字詞";
            } else if (targetView === 'cloud') {
                indicator.innerText = "目前模式：☁️ 文字雲投影中";
                // Trigger canvas redraw instantly
                setTimeout(() => {
                    window.dispatchEvent(new Event('resize'));
                }, 50);
            } else if (targetView === 'admin') {
                indicator.innerText = "目前模式：🔑 管理者後台";
            }
        }

        // Admin Auth Control
        function showAdminGate(show) {
            const gate = document.getElementById('admin-gate');
            const panel = document.getElementById('admin-panel');
            const activeView = document.getElementById('view-admin');

            activeView.classList.remove('hidden');
            document.querySelectorAll('.view-section').forEach(view => {
                if (view.id !== 'view-admin') view.classList.add('hidden');
            });

            if (show) {
                gate.classList.remove('hidden');
                panel.classList.add('hidden');
                document.getElementById('admin-pwd-input').focus();
            } else {
                gate.classList.add('hidden');
                panel.classList.remove('hidden');
            }
        }

        function verifyAdminPassword() {
            const pwdInput = document.getElementById('admin-pwd-input');
            const pwd = pwdInput.value;

            if (pwd === 'kirby0427') {
                isAdminAuthenticated = true;
                showToast("管理者登入成功！已解鎖管理功能", "success");
                pwdInput.value = '';
                showAdminGate(false);
                executeViewSwitch('admin');
            } else {
                showToast("密碼錯誤，請再試一次！", "error");
                pwdInput.value = '';
                pwdInput.focus();
            }
        }

        // Listen to Enter key inside Admin input
        document.getElementById('admin-pwd-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyAdminPassword();
            }
        });

        // Custom loading indicator control
        function showLoading(show) {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) {
                if (show) spinner.classList.remove('hidden');
                else spinner.classList.add('hidden');
            }
        }

        // Open clear modal confirmation screen
        function openClearModal() {
            const modal = document.getElementById('clear-modal');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('opacity-100');
            modal.querySelector('div').classList.remove('scale-95');
            modal.querySelector('div').classList.add('scale-100');
        }

        // Close clear modal confirmation screen
        function closeClearModal() {
            const modal = document.getElementById('clear-modal');
            modal.classList.add('pointer-events-none');
            modal.classList.remove('opacity-100');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
        }

        // Copy Shareable link inside restricted sandbox
        function copyShareLink() {
            try {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                // Share absolute browser link
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast("連結複製成功！快分享給朋友填寫吧 🚀", "success");
            } catch (err) {
                console.error("Link copy failed:", err);
                showToast("瀏覽器限制，請點擊上方網址列手動複製連結！", "error");
            }
        }

        // Toast Messages Factory
        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let typeStyles = "bg-slate-900 border-emerald-500/50 text-emerald-200 shadow-neon-cyan";
            let icon = "fa-circle-check text-emerald-400";
            if (type === "warning") {
                typeStyles = "bg-slate-900 border-amber-500/50 text-amber-200";
                icon = "fa-triangle-exclamation text-amber-400";
            } else if (type === "error") {
                typeStyles = "bg-slate-900 border-rose-500/50 text-rose-200 shadow-neon-pink";
                icon = "fa-circle-xmark text-rose-400";
            }

            toast.className = `p-4 border rounded-xl flex items-start gap-3 shadow-lg pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 ${typeStyles}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg mt-0.5"></i>
                <div class="flex-grow">
                    <p class="text-xs font-semibold">${message}</p>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-[-10px]', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
    </script>
